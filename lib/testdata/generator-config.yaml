      - function: rand_user
      - function: rand_device_type
      - function: uuid
        args: ["session.id"]

  - name: change_leverage
    frequency: 2
    severity: 9
    severity_text: INFO
    body:
      function: change_leverage_body
    attributes:
      - function: rand_user
      - function: rand_device_type
      - function: uuid
        args: ["session.id"]

  - name: margin_repay
    frequency: 3
    severity: 9
    severity_text: INFO
    body:
      function: margin_repay_body
    attributes:
      - function: rand_user
      - function: rand_device_type
      - function: uuid
        args: ["session.id"]

  - name: convert_assets
    frequency: 8
    severity: 9
    severity_text: INFO
